## Version 2026/08/06
# make sure that your yabits-server container is named yabits-server
# make sure that your dns has a record for the subdomain on server_name below
# make sure both containers are on the same user-defined docker network, because
# the default bridge has no dns between containers and $upstream_app is a name

# Copy to /config/nginx/proxy-confs/yabits-server.subdomain.conf and restart
# swag. The name must end in .conf; swag ignores .conf.sample.

server {
    listen 443 ssl;
#    listen 443 quic;
    listen [::]:443 ssl;
#    listen [::]:443 quic;

    # This example matches SUBDOMAINS=habits in SWAG. Replace only "habits" with
    # the exact subdomain label you configured before loading this file.
    server_name habits.*;

    include /config/nginx/ssl.conf;

    # 16m, not 0. Unlimited is what most SWAG sample confs use, and it hands an
    # unauthenticated caller the ability to make nginx stream an arbitrary number
    # of bytes at the upstream. 16m is double the protocol's 8 MiB maxBodyBytes
    # (docs/SYNC-PROTOCOL.md section 13), which is the number that matters: the
    # server's limit has to be the one that trips first, because it answers with
    # the JSON error envelope a client can parse, while nginx answers with an HTML
    # error page that no client here can read. Raising the server's limit means
    # raising this one first.
    client_max_body_size 16m;

    # Enable if Cloudflare is in front of this. Without it nginx sees a
    # Cloudflare edge address as the client and forwards that, so every visitor
    # arrives from one of a handful of addresses and the server's per-IP auth
    # rate limit silently becomes a global one, which one attacker can use to
    # lock out every user. The file sets set_real_ip_from for Cloudflare's
    # published ranges plus real_ip_header CF-Connecting-IP; see
    # deploy/README.md for how to build it.
    #include /config/nginx/cf-real-ip.conf;

    # enable for ldap auth (requires ldap-location.conf in the location block)
    #include /config/nginx/ldap-server.conf;

    # enable for Authelia (requires authelia-location.conf in the location block)
    #include /config/nginx/authelia-server.conf;

    # enable for Authentik (requires authentik-location.conf in the location block)
    #include /config/nginx/authentik-server.conf;

    # enable for Tinyauth (requires tinyauth-location.conf in the location block)
    #include /config/nginx/tinyauth-server.conf;

    location / {
        # enable the next two lines for http auth
        #auth_basic "Restricted";
        #auth_basic_user_file /config/nginx/.htpasswd;

        # enable for ldap auth (requires ldap-server.conf in the server block)
        #include /config/nginx/ldap-location.conf;

        # enable for Authelia (requires authelia-server.conf in the server block)
        #include /config/nginx/authelia-location.conf;

        # enable for Authentik (requires authentik-server.conf in the server block)
        #include /config/nginx/authentik-location.conf;

        # enable for Tinyauth (requires tinyauth-server.conf in the server block)
        #include /config/nginx/tinyauth-location.conf;

        # Do not enable a forward-auth include here if the iOS app syncs to this
        # host. The app sends a device token, not a browser session, so an SSO
        # redirect turns every sync into an HTML login page it cannot answer.

        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app yabits-server;
        set $upstream_port 8080;
        set $upstream_proto http;
        # Never forward a client-chosen trace id from the internet. The app
        # accepts this header from SWAG because SWAG is a trusted peer.
        proxy_set_header X-Request-Id $request_id;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # proxy.conf supplies HTTP/1.1, WebSocket upgrade headers and the normal
        # read timeout. Keep buffering and gzip at their SWAG defaults here so
        # ordinary UI and API responses retain normal proxy performance. The
        # long-lived event stream gets its narrower exceptions below.
    }

    # The event stream. The path is /api/v1/sync/events, from the endpoint table
    # in docs/SYNC-PROTOCOL.md section 1; section 11 shows the same route.
    #
    # A prefix match (^~), not an exact one (=), and this is the important part of
    # the block. A location that does not match is not an error in nginx: the
    # request quietly falls through to location / and gets that block's 240s
    # proxy_read_timeout back, so the stream is cut every four minutes and the
    # browser reconnects in a loop that reads as a flaky network. Nothing in the
    # server log says why, and it only happens behind the proxy. An exact match
    # misses a trailing slash and misses any suffix the route might grow; a prefix
    # cannot. It also has to be ^~ rather than a plain prefix, so that a regex
    # location added by a future include cannot take the stream back.
    #
    # If the route itself ever moves, this string has to move with it. The deploy
    # job in .github/workflows/ci.yml greps the protocol doc's endpoint table and
    # fails if the two disagree, because a human noticing is not a mechanism.
    #
    # This block does not include proxy.conf, which is the only way to raise
    # proxy_read_timeout: the include sets it, and a second one anywhere in the
    # same context is fatal rather than an override. The cost is that the headers
    # the server depends on are repeated by hand below, so if proxy.conf gains a
    # header the server needs, it has to be added here too.
    location ^~ /api/v1/sync/events {
        include /config/nginx/resolver.conf;
        set $upstream_app yabits-server;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # HTTP/1.0 has no chunked transfer encoding, so a response with no
        # Content-Length can only be terminated by closing the connection. An
        # SSE response never terminates, which under 1.0 means it never starts.
        proxy_http_version 1.1;

        # A stream is idle between events by design, so the read timeout has to
        # be longer than any gap the server will ever leave. 24h is longer than
        # any plausible session. Without this the connection would be cut
        # whenever nothing happened for 240s and the browser would reconnect on
        # a loop that reads as network flapping.
        #
        # This is a backstop, not the mechanism: the server sends a heartbeat
        # event every 15 seconds (docs/SYNC-PROTOCOL.md section 11.1), which
        # resets this timer long before it expires. The heartbeat exists because
        # Cloudflare closes an idle proxied connection after about 100 seconds
        # and no configuration on this side can change that. See deploy/README.md.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # Keep this inside the event-stream location. Disabling gzip for the
        # whole server would needlessly enlarge normal UI and API responses.
        gzip off;

        # Repeated from proxy.conf because this block cannot include it. Only the
        # headers the server actually reads, plus Host, which it needs to build
        # absolute URLs consistently with YABITS_EXTERNAL_URL.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;

        # Nothing here is being upgraded, unlike the Connection header proxy.conf
        # sets for WebSocket support. Clearing it lets nginx keep the upstream
        # connection rather than being told to close it.
        proxy_set_header Connection "";
    }
}
